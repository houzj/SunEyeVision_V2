<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M09 子程序/Group进入、返回及配置</title>
<style>
:root{
  --bg:#0d1b28; --text:#dde9f0; --dim:#8ba3b5; --faint:#5f7889;
  --line:#22394a; --accent:#7fd4e8; --warn:#e0a06a; --ok:#7fd3a8; --bad:#e88d8d;
}
*{box-sizing:border-box}
body{
  max-width:700px;margin:0 auto;padding:40px 26px 90px;
  background:var(--bg);color:var(--text);
  font:15px/1.75 "Microsoft YaHei","PingFang SC",-apple-system,sans-serif;
}
a{color:#8fd3e4}

.crumb{font-size:12px;color:var(--faint);margin-bottom:12px}
.crumb a{text-decoration:none}
.crumb a:hover{text-decoration:underline}

h1{margin:0 0 10px;font-size:22px;font-weight:600;line-height:1.4}
.meta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px}
.tag{font-size:11.5px;padding:2px 7px;border-radius:3px;border:1px solid var(--line);color:var(--dim)}
.tag.st{color:var(--ok);border-color:#3a6b58}
.tag.st.partial{color:var(--warn);border-color:#6b553a}
.tag.st.none{color:var(--bad);border-color:#6b3a3a}

.lead{font-size:15.5px;color:#eef6fa;margin:0 0 20px}

/* 流程图 */
.flow{margin:0 0 26px;padding:0;list-style:none}
.flow li{
  position:relative;padding:5px 0 5px 30px;
  font-family:Consolas,monospace;font-size:12.5px;color:#a8c6d6;line-height:1.5;
}
.flow li::before{
  content:attr(data-i);position:absolute;left:0;top:5px;
  width:20px;height:20px;line-height:20px;text-align:center;
  font-size:10.5px;color:var(--accent);
  background:#0a1b29;border:1px solid #2c4a5f;border-radius:50%;
}
.flow li::after{
  content:"";position:absolute;left:9.5px;top:25px;bottom:-1px;
  width:1px;background:#2c4a5f;
}
.flow li:last-child::after{display:none}

.blk{margin:0 0 18px}
.blk h2{
  font-size:12.5px;font-weight:600;color:#7fa8bd;letter-spacing:.04em;
  margin:0 0 7px;
}
.blk p{margin:0 0 6px}
.blk .more{display:none}
.blk.open .more{display:block}

/* 分号拆成的清单 */
ul.pts{margin:0;padding:0;list-style:none}
ul.pts li{
  position:relative;padding:2px 0 2px 15px;color:var(--text);line-height:1.65;
}
ul.pts li::before{
  content:"";position:absolute;left:2px;top:12px;
  width:4px;height:4px;border-radius:50%;background:#3f6b80;
}

.toggle{
  background:none;border:0;padding:0;margin-top:2px;
  font-size:11.5px;color:var(--faint);cursor:pointer;
}
.toggle:hover{color:var(--accent)}

.chips{display:flex;flex-wrap:wrap;gap:5px;margin:0;padding:0;list-style:none}
.chips li{font-size:11px;padding:2px 7px;border-radius:3px;background:#12293a;border:1px solid var(--line);color:#9dbdcd}

details{border-top:1px solid var(--line);margin-top:10px;padding-top:9px}
details summary{cursor:pointer;list-style:none;font-size:12px;color:var(--faint)}
details summary::-webkit-details-marker{display:none}
details summary:hover{color:var(--accent)}
details[open] summary{margin-bottom:8px}
details .bd{font-size:13px;color:var(--dim);line-height:1.75}
details .bd p{margin:0 0 7px}

footer{margin-top:36px;padding-top:13px;border-top:1px solid var(--line);font-size:12px;color:var(--faint)}
footer a{color:var(--dim)}

@media(max-width:600px){ body{padding:28px 15px 70px} h1{font-size:20px} }
</style>
</head>
<body>

<div class="crumb">
  <a href="../index.html">目录</a> ›
  <a href="../index.html#g-能力对照">能力对照</a> ›
  M09
</div>

<div id="page"></div>

<script>
const D = {"id":"M09","group":"main","title":"子程序/Group进入、返回及配置","state":"partial","chain":["节点打开决策","OnControlFlowNodeOpen","子程序导航","NavigateBack / SubroutineSettings"],"current":"SubroutineId分支、返回按钮及设置入口存在。","gap":"进入/返回仅覆盖导航；循环/中断/累积三类执行合同各自缺证 Run最终仅在!Success且Errors非空时SetError，其余SetSuccess；ExecutionResult.CreateCancelled只填Status/IsStopped/CompletionMessage而不加Errors。若前面输出解析完成，无错误文本的取消会进入成功分支。循环合并初值new ExecutionResult的Success默认false，也不该靠Errors补救聚合状态。 子调用使用Task.Run(async delegate).GetAwaiter().GetResult；循环间隔Task.Delay未传取消令牌。根session取消会进入子图，但间隔本身不可被该令牌唤醒；不能从Task.Run推立即停止。 CreateChildScope有独立RunId及ConsumerScope，子结果却为下钻显示按原kvp.Key（NodeId）写RootContext。两个父调用同一子图内部ID相同，根投影可覆盖，循环也仅保留最后一轮；这证明缓存键丢调用身份，不证明子图算法上下文本身共用。 委托调用ExecuteWorkflowCore时globalVariables固定null，子Context.GlobalVariables因此为空；__GlobalVars__合成与脚本请求都读取该字段。父输入contextVariables仍正常，不与显式端口传参或变量接收服务混为一谈。 当前校验拒自身调用和目标不存在，DetectCycles只查本图Nodes/Connections；CreateChildScope只核父RunId归属。A→B→A两图本身无连线环仍逐图通过；CallStack字段未作为当前执行器门禁，未声称已观察栈溢出。","vm":"恢复模型F10–F15分别列身份、导航、循环、中断、累积和配置，不能合并为一个支持Group。","vmDoc":"WORKFLOW-TAB-TOOLBOX-GROUP-CLOSURE.md","vmLimit":"VM原版恢复与重建实现须分开；该材料入口不等原生/全部场景已闭合。","choice":"必须整改","reason":"依据：已确认终态映射依赖Errors、循环间隔无取消令牌、根展示缓存拍平子调用身份；需局部整改，不推出子图算法共用或整体迁VM。 VM参考边界：原版Group身份、运行目标与显示模块集分离值得逐能力对账。 结论仅针对列明范围，不作整体优胜排名。","change":"拆控制语义验收表；优先补嵌套、输入、取消的实际边，再决定子程序与Group是否独立建模。 拆导航与六类Group行为的状态表，再追内部图执行/参数快照；不以UI能进入判等价VM Group，专参数页缺口单列T29。","accept":"嵌套返回、复制、跨层引用、取消和部分失败逐类通过，不能只看能进入。 构造Cancelled无Errors且有可解析输出、Failed空Errors、正常多轮和零轮分别验；父节点不得把取消记成功。 长间隔中取消、子图执行中取消、连续调试关闭、子图异常均等待正确终态；取消不会再启动下一轮。 同子图双调用并发/顺序、嵌套同名节点、多轮下钻分别验，不互相替换所选调用结果；方案切换拒迟到回填。 根/一层/两层子图普通全局与脚本读取、生产者失败、同名局部输入及运行中改初值分别核值身份。 A→A/A→B→A/A→B→C→A、合法复用子图、深层嵌套、载入绕过UI及取消分别验。","sourceIds":["S021","S022","S023","R016","R017","N048","N049","N050","N058","N060"],"optimization":"O02","validation":"仅静态复核；未运行产品/设备/故障注入","review":{"id":"M09","before":"partial","after":"partial","confirmed":"NodeOpenDecisionChain按SubroutineId进入控制分支；Workspace有返回和设置窗口入口。","missingEdges":["进入/返回仅覆盖导航","循环/中断/累积三类执行合同各自缺证","根流程IO与Group配置器的范围不同，已拆M25/T29"],"cause":"范围混合导致的覆盖缺口","change":"拆导航与六类Group行为的状态表，再追内部图执行/参数快照；不以UI能进入判等价VM Group，专参数页缺口单列T29。","acceptance":"嵌套返回、复制、跨层引用、取消和部分失败逐类通过，不能只看能进入。","sourceIds":["S021","S022","S023","R016","R017"],"decision":"仅明确证据与缺口，不因复核次数或材料交付自动升级"},"previousRecommendation":{"choice":"保留子程序机制，按六类能力补差","reason":"避免为了名称一致重写模型；行为等价要逐控制结构证明。"},"defect":"已确认终态映射依赖Errors、循环间隔无取消令牌、根展示缓存拍平子调用身份；需局部整改，不推出子图算法共用或整体迁VM。","vmBorrow":"原版Group身份、运行目标与显示模块集分离值得逐能力对账。","difference":"差异大","differenceBasis":"列明的业务范围、状态合同、数据/依赖或文件模型有重要差异；不同不自动等于较差。","adoption":"自研整改","adoptionBasis":"针对本项目已见合同/实现修正，尚无采用VM具体实现的充分依据。","selectionStatus":"方案建议，产品尚未实施/验收；本轮没有直接采用VM逆向代码的项目","reviewDecision":{"category":"必须整改","defect":"已确认终态映射依赖Errors、循环间隔无取消令牌、根展示缓存拍平子调用身份；需局部整改，不推出子图算法共用或整体迁VM。","borrow":"原版Group身份、运行目标与显示模块集分离值得逐能力对账。","action":"拆控制语义验收表；优先补嵌套、输入、取消的实际边，再决定子程序与Group是否独立建模。","difference":"差异大","adoption":"自研整改","confidence":"代码事实与设计要求分列；整改/借鉴范围不等产品已验收","sourceIds":["S021","S022","S023","R016","R017","N048","N049","N050","N058","N060"]}};

const esc = s => String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const stMap = {"implemented":["已实现","st"],"partial":["部分实现","st partial"],"unimplemented":["未实现","st none"],"unknown":["未确认","st none"]};

/* 按分号拆句：长报告腔拆成一条一句 */
function pts(s){
  if(!s) return "";
  const arr = s.split(/[；;]/).map(x=>x.trim()).filter(Boolean);
  if(arr.length < 2) return '<p>'+esc(s)+'</p>';
  return '<ul class="pts">'+arr.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
}
/* 摘要：第一句，压到 50 字内 */
function brief(s){
  if(!s) return "";
  const first = s.split(/[；;。]/)[0].trim();
  return first.length > 52 ? first.slice(0,52)+"…" : first;
}
/* 需要“展开”的长内容 */
function moreBox(fullHtml){
  return '<div class="more">'+fullHtml+'</div><button class="toggle">展开全文</button>';
}

const st = stMap[D.state] || [D.state||"未标注","st"];
const out = [];

out.push('<h1>'+esc(D.title)+'</h1>');
out.push('<div class="meta"><span class="tag">'+esc(D.id)+'</span><span class="tag '+st[1]+'">'+esc(st[0])+'</span>'+
  (D.optimization?'<span class="tag">影响 '+esc(D.optimization)+'</span>':'')+'</div>');

if(D.current) out.push('<p class="lead">'+esc(D.current)+'</p>');

/* 调用顺序：流程图 */
if(D.chain && D.chain.length){
  out.push('<ul class="flow">'+D.chain.map((c,i)=>'<li data-i="'+(i+1)+'">'+esc(c)+'</li>').join('')+'</ul>');
}

/* 差在哪 */
let gapFull = '';
if(D.gap) gapFull += pts(D.gap);
if(D.defect) gapFull += '<p><b>缺陷：</b>'+esc(D.defect)+'</p>';
if(D.vm) gapFull += '<p><b>VM 的做法：</b>'+esc(D.vm)+'</p>';
if(D.vmLimit) gapFull += '<p><b>对照边界：</b>'+esc(D.vmLimit)+'</p>';
out.push('<div class="blk"><h2>差在哪</h2>'+pts(brief(D.gap))+moreBox(gapFull)+'</div>');

/* 怎么改 */
let chgFull = '';
if(D.change) chgFull += pts(D.change);
if(D.choice) chgFull += '<p><b>取舍：</b>'+esc(D.choice)+'</p>';
if(D.reason) chgFull += '<p><b>依据：</b>'+esc(D.reason)+'</p>';
if(D.vmBorrow) chgFull += '<p><b>可借鉴：</b>'+esc(D.vmBorrow)+'</p>';
out.push('<div class="blk"><h2>怎么改</h2>'+pts(brief(D.change))+moreBox(chgFull)+'</div>');

/* 怎么验 */
out.push('<div class="blk"><h2>怎么验</h2>'+pts(brief(D.accept))+moreBox(pts(D.accept))+'</div>');

/* 证据 */
if(D.sourceIds && D.sourceIds.length){
  out.push('<div class="blk"><h2>证据'+(D.validation?' · '+esc(D.validation):'')+'</h2><ul class="chips">'+
    D.sourceIds.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>');
}

/* 复核与历史，默认收起 */
if(D.review){
  const r=D.review; let b='';
  if(r.confirmed) b+='<p><b>已确认：</b>'+esc(r.confirmed)+'</p>';
  if(r.missingEdges&&r.missingEdges.length) b+='<p><b>缺口：</b>'+r.missingEdges.map(x=>'<br>· '+esc(x)).join('')+'</p>';
  if(r.decision) b+='<p><b>结论：</b>'+esc(r.decision)+'</p>';
  out.push('<details><summary>复核记录（'+esc(r.before||'')+' → '+esc(r.after||'')+'）</summary><div class="bd">'+b+'</div></details>');
}
if(D.previousRecommendation){
  const p=D.previousRecommendation;
  out.push('<details><summary>以前的想法（'+esc(p.choice||'')+'）</summary><div class="bd"><p>'+esc(p.reason||'')+'</p></div></details>');
}

document.getElementById("page").innerHTML = out.join('');

document.getElementById("page").addEventListener("click", e => {
  if(!e.target.classList.contains("toggle")) return;
  const blk = e.target.closest(".blk");
  const on = blk.classList.toggle("open");
  e.target.textContent = on ? "收起" : "展开全文";
});
</script>

<footer>
  原始详细材料：<a href="../现状分析/suneye-entry-architecture-comparison.html">主界面架构</a>
</footer>

</body>
